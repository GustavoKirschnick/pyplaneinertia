[project]
name = "pyplaneinertia"
version = "0.1.0"
description = "Inertia properties of an aircraft lifting-surfaces for analysis"
readme = "README.md"
authors = [
    { name = "GustavoKirschnick", email = "gustavoborges107@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "pytest>=9.1.1",
]

[project.scripts]
pyplaneinertia = "pyplaneinertia:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
