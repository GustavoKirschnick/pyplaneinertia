name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff lint
        uses: astral-sh/ruff-action@v4
      - name: Ruff format check
        uses: astral-sh/ruff-action@v4
        with:
          args: "format --check"